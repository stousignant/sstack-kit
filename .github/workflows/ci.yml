name: Documentation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check
          tar -xzOf "$archive" gitleaks > "$binary"
          chmod 0755 "$binary"
          test -x "$binary"

      - name: Run standard-library tests and native scanner canaries
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
          TMPDIR: ${{ runner.temp }}
        run: python3 -m unittest discover -s tests -v

      - name: Validate documentation
        run: python3 scripts/check_docs.py

      - name: Scan working-tree files
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: python3 scripts/check_secrets.py --working-tree

      - name: Scan all fetched Git history
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: python3 scripts/check_secrets.py --history
